name: Actualizar base de datos

# Aplica en Supabase las migraciones de supabase/migrations cada vez que cambian.
on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar configuración
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning title=Base de datos::Faltan SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD o SUPABASE_PROJECT_REF en GitHub."
            echo "LISTO=no" >> "$GITHUB_ENV"
          else
            echo "LISTO=si" >> "$GITHUB_ENV"
          fi

      - uses: supabase/setup-cli@v1
        if: env.LISTO == 'si'
        with:
          version: latest

      - name: Aplicar migraciones
        if: env.LISTO == 'si'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
          echo "::notice title=Base de datos::Migraciones aplicadas en Supabase."
