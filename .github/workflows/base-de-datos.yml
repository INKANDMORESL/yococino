name: Actualizar base de datos

# Aplica en Supabase las migraciones de supabase/migrations cada vez que cambian.
on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar configuración
        run: |
          FALTAN=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && FALTAN="$FALTAN secreto SUPABASE_ACCESS_TOKEN,"
          [ -z "$SUPABASE_DB_PASSWORD" ] && FALTAN="$FALTAN secreto SUPABASE_DB_PASSWORD,"
          [ -z "$SUPABASE_PROJECT_REF" ] && FALTAN="$FALTAN variable SUPABASE_PROJECT_REF,"
          if [ -n "$FALTAN" ]; then
            echo "::warning title=Base de datos::Faltan en GitHub:$FALTAN"
            echo "LISTO=no" >> "$GITHUB_ENV"
          else
            echo "LISTO=si" >> "$GITHUB_ENV"
          fi

      - uses: supabase/setup-cli@v1
        if: env.LISTO == 'si'
        with:
          version: latest

      - name: Aplicar migraciones
        if: env.LISTO == 'si'
        run: |
          set -o pipefail
          informar() {
            # Resume el error en una línea visible desde la API de GitHub (los secretos salen ocultos).
            RESUMEN=$(grep -v '^\s*$' salida.txt | tail -n 6 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=Base de datos ($1)::$RESUMEN"
            exit 1
          }
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee salida.txt || informar "enlazar"
          supabase db push --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee salida.txt || informar "migrar"
          echo "::notice title=Base de datos::Migraciones aplicadas en Supabase."
