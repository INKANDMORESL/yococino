name: Comprobar app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Datos públicos de Supabase que se incluyen dentro de la app al compilar.
# Se configuran en GitHub: Settings > Secrets and variables > Actions > Variables.
env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

jobs:
  comprobar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          for intento in 1 2 3; do
            npm install --no-audit --no-fund > instalar.txt 2>&1 && exit 0
            sleep 15
          done
          echo "::error title=Instalar dependencias::$(grep -iE 'npm (error|ERR)' instalar.txt | head -n 8 | tr '\n' ' ' | cut -c1-900)"
          exit 1

      - name: Comprobar versiones compatibles con Expo
        run: |
          npx expo install --check > salida.txt 2>&1 && { cat salida.txt; exit 0; }
          cat salida.txt
          grep -v '^\s*$' salida.txt | tail -n 12 | while IFS= read -r l; do echo "::error title=Versiones Expo::$l"; done
          exit 1

      - name: Comprobar el código (TypeScript)
        run: |
          npx tsc --noEmit > salida.txt 2>&1 && { cat salida.txt; exit 0; }
          cat salida.txt
          grep -v '^\s*$' salida.txt | tail -n 12 | while IFS= read -r l; do echo "::error title=TypeScript::$l"; done
          exit 1

      - name: Generar la versión web de prueba
        run: npx expo export --platform web

      - name: Guardar la versión web
        uses: actions/upload-artifact@v4
        with:
          name: yococino-web
          path: movil/dist
          retention-days: 14

  vista-previa:
    # Publica la app para abrirla en el móvil con Expo Go.
    # Solo funciona cuando el secreto EXPO_TOKEN está creado en GitHub.
    needs: comprobar
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 22

      - name: Instalar dependencias
        if: env.EXPO_TOKEN != ''
        run: |
          for intento in 1 2 3; do
            npm install --no-audit --no-fund > instalar.txt 2>&1 && exit 0
            sleep 15
          done
          echo "::error title=Instalar dependencias::$(grep -iE 'npm (error|ERR)' instalar.txt | head -n 8 | tr '\n' ' ' | cut -c1-900)"
          exit 1

      - name: Enlazar con el proyecto de Expo
        if: env.EXPO_TOKEN != ''
        run: npx --yes eas-cli@latest init --non-interactive --force

      - name: Configurar actualizaciones
        if: env.EXPO_TOKEN != ''
        run: npx --yes eas-cli@latest update:configure --platform all --non-interactive

      - name: Publicar vista previa
        if: env.EXPO_TOKEN != ''
        run: npx --yes eas-cli@latest update --branch vista-previa --message "${{ github.event.head_commit.message }}" --non-interactive

      - name: Publicar versión web
        if: env.EXPO_TOKEN != ''
        run: |
          npx expo export --platform web
          npx --yes eas-cli@latest deploy --prod --non-interactive --json > deploy.json || (cat deploy.json; exit 1)
          URL=$(node -e "const d=require('./deploy.json'); console.log(d.production?.url || d.deployment?.url || d.url || JSON.stringify(d))")
          echo "::notice title=Web de Yococino::$URL"

      - name: Aviso si falta el secreto
        if: env.EXPO_TOKEN == ''
        working-directory: .
        run: echo "Falta el secreto EXPO_TOKEN; la vista previa en el móvil no se ha publicado."
