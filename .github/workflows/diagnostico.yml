# Diagnóstico de solo lectura: estado de los lotes de recetas y fotos y registros recientes de las funciones.
# No muestra datos personales ni de salud. Se lanza a mano.
name: Diagnóstico

on:
  workflow_dispatch:
    inputs:
      enlace:
        description: 'Enlace de una publicación para ver qué se lee de ella (opcional)'
        required: false

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Lotes y fotos
        run: |
          Q="select json_build_object(
            'recetas', (select count(*) from public.recetas where not oculta),
            'con_foto', (select count(*) from public.recetas where not oculta and imagen is not null),
            'en_lote', (select count(*) from public.recetas where foto_en_lote),
            'sin_mini', (select count(*) from public.recetas where imagen is not null and imagen_mini is null),
            'importaciones', (select json_agg(i) from (select url_norm, clase, receta_id, publica, avisos, created_at from public.importaciones order by created_at desc limit 5) i),
            'mis_recetas', (select count(*) from public.mis_recetas),
            'usos_importar', (select json_agg(u) from (select tipo, coste_usd, created_at from public.usos_ia where tipo = 'importar' order by created_at desc limit 5) u),
            'lotes', (select json_agg(l) from (select id, tipo, estado, proveedor_id, jsonb_array_length(coalesce(datos->'recetas','[]'::jsonb)) as n, resultado, created_at, terminado_at from public.lotes_ia order by created_at desc limit 3) l)
          ) as r"
          jq -n --arg q "$Q" '{query: $q, read_only: true}' > q.json
          curl -sS -w '\nHTTP %{http_code}\n' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @q.json | tee r.txt
          echo "::notice title=Lotes::$(head -c 3500 r.txt | tr '\n' ' ')"

      - name: Registros de sembrar-recetas
        run: |
          SQL="select datetime(timestamp) as t, event_message from function_logs where regexp_contains(event_message, 'sembrar|lote|Gemini|foto|CPU|WORKER|memory') order by timestamp desc limit 30"
          curl -sS -G -w '\nHTTP %{http_code}\n' "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --data-urlencode "sql=$SQL" | tee l.txt
          echo "::notice title=Registros::$(head -c 3500 l.txt | tr '\n' ' ')"

      - uses: actions/checkout@v4
        if: inputs.enlace != ''
      - uses: denoland/setup-deno@v2
        if: inputs.enlace != ''
        with:
          deno-version: v2.x
      - name: Leer publicación
        if: inputs.enlace != ''
        run: |
          deno run -A supabase/pruebas/leer_publicacion.ts "${{ inputs.enlace }}" | tee p.txt
          echo "::notice title=Publicacion::$(head -c 3000 p.txt | tr '\n' ' ')"
