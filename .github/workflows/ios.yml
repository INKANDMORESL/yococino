# Prepara la app de iPhone en los servidores de Expo y la sube a TestFlight (App Store Connect).
# Se lanza a mano desde GitHub → Actions → «App iPhone» → Run workflow.
# Necesita en GitHub (Secrets): EXPO_TOKEN, ASC_API_KEY_P8 (texto del archivo .p8), ASC_KEY_ID, ASC_ISSUER_ID,
# APPLE_TEAM_ID; y en Variables: ASC_APP_ID (Apple ID numérico de la app en App Store Connect) y,
# para los pagos, REVENUECAT_IOS_KEY. Con la clave de App Store Connect, Expo crea solo los certificados.
name: App iPhone

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: COMPANY_OR_ORGANIZATION
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobar los datos de Apple y Expo
        run: |
          falta=""
          [ -z "$EXPO_TOKEN" ] && falta="$falta EXPO_TOKEN"
          [ -z "$ASC_API_KEY_P8" ] && falta="$falta ASC_API_KEY_P8"
          [ -z "$EXPO_ASC_KEY_ID" ] && falta="$falta ASC_KEY_ID"
          [ -z "$EXPO_ASC_ISSUER_ID" ] && falta="$falta ASC_ISSUER_ID"
          [ -z "$EXPO_APPLE_TEAM_ID" ] && falta="$falta APPLE_TEAM_ID"
          [ -z "$ASC_APP_ID" ] && falta="$falta ASC_APP_ID(variable)"
          if [ -n "$falta" ]; then echo "::error title=App iPhone::Faltan en GitHub:$falta"; exit 1; fi
          printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: |
          for intento in 1 2 3; do
            npm install --no-audit --no-fund > instalar.txt 2>&1 && exit 0
            sleep 15
          done
          cat instalar.txt | tail -n 30
          exit 1

      - name: Enlazar con el proyecto de Expo
        run: |
          npx --yes eas-cli@latest init --non-interactive --force
          npx --yes eas-cli@latest update:configure --platform all --non-interactive

      - name: Datos públicos del servidor y envío a TestFlight
        run: |
          jq --arg url "${{ vars.SUPABASE_URL }}" --arg clave "${{ vars.SUPABASE_ANON_KEY }}" --arg rc "${{ vars.REVENUECAT_IOS_KEY }}" \
             --arg p8 "$EXPO_ASC_API_KEY_PATH" --arg kid "$EXPO_ASC_KEY_ID" --arg iss "$EXPO_ASC_ISSUER_ID" --arg team "$EXPO_APPLE_TEAM_ID" --arg app "$ASC_APP_ID" \
            '.build.production.env = ({EXPO_PUBLIC_SUPABASE_URL: $url, EXPO_PUBLIC_SUPABASE_ANON_KEY: $clave} + (if $rc != "" then {EXPO_PUBLIC_REVENUECAT_IOS_KEY: $rc} else {} end))
             | .submit.production.ios = {ascApiKeyPath: $p8, ascApiKeyId: $kid, ascApiKeyIssuerId: $iss, appleTeamId: $team, ascAppId: $app}' eas.json > eas.tmp && mv eas.tmp eas.json

      - name: Crear la app de iPhone y subirla a TestFlight
        run: |
          if npx --yes eas-cli@latest build --platform ios --profile production --non-interactive --auto-submit --wait > salida.txt 2>&1; then
            tail -n 20 salida.txt
            echo "::notice title=App iPhone::Creada y enviada a TestFlight. Apple tarda unos minutos en procesarla; luego aparece en App Store Connect → TestFlight."
            exit 0
          fi
          if ! grep -q "Credentials are not set up\|not validated for non-interactive" salida.txt; then
            cat salida.txt
            echo "::error title=App iPhone::$(grep -v '^\s*$' salida.txt | tail -n 14 | tr '\n' ' ' | cut -c1-1800)"
            exit 1
          fi
          # La primera vez Expo tiene que crear los certificados y perfiles de Apple y lo pregunta en pantalla:
          # se responde «sí» a todo con la clave de App Store Connect (sin usuario ni contraseña de Apple).
          echo "Primera vez: creando certificados de Apple…"
          sudo apt-get install -y expect > /dev/null
          cat > responder.exp <<'EXP'
          set timeout 1800
          log_user 1
          spawn npx --yes eas-cli@latest build --platform ios --profile production --auto-submit --no-wait
          expect {
            -re {(?i)log in to your apple account\?} { send "n\r"; exp_continue }
            -re {(?i)apple id:} { send "\003"; exit 3 }
            -re {\(Y/n\)} { send "y\r"; exp_continue }
            -re {\(y/N\)} { send "y\r"; exp_continue }
            -re {(?i)select|choose|which} { send "\r"; exp_continue }
            -re {›} { send "\r"; exp_continue }
            eof
          }
          catch wait resultado
          exit [lindex $resultado 3]
          EXP
          sed -i 's/^          //' responder.exp
          if expect responder.exp > salida2.txt 2>&1; then
            tail -n 30 salida2.txt
            echo "::notice title=App iPhone::Certificados creados y app enviada a Expo. Tarda unos 20-40 minutos en crearse y subirse a TestFlight."
          else
            tail -n 60 salida2.txt
            echo "::error title=App iPhone::$(sed 's/\x1b\[[0-9;]*[A-Za-z]//g' salida2.txt | grep -v '^\s*$' | tail -n 16 | tr '\n' ' ' | cut -c1-1800)"
            exit 1
          fi
