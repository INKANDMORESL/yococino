# Receta para Instagram cada 2 días: deja candidatas en redes/recetas-instagram/pendiente.json.
# La publicación la programa en Metricool una tarea programada de Claude, que la apunta en hechas.json.
name: Receta para Instagram

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  receta:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Elegir candidatas
        run: |
          deno run -A redes/receta_instagram.ts > salida.txt 2>&1 || { cat salida.txt; echo "::error title=Receta::$(tail -n 3 salida.txt | tr '\n' ' ')"; exit 1; }
          cat salida.txt
          echo "::notice title=Receta::$(cat salida.txt | tr '\n' ' ')"
      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add redes/recetas-instagram/pendiente.json
          git diff --cached --quiet || { git commit -m "Receta para Instagram: candidatas" && git pull --rebase -q && git push; }
