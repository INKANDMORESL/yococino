# Tareas del recetario sin abrir la app: crear recetas por lotes, añadir las típicas, pedir fotos
# y recoger lo que ya esté terminado. Cada 30 minutos recoge solo los lotes terminados.
name: Recetario

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      accion:
        description: 'Qué hacer'
        type: choice
        options: [estado, especiales, tipicas, airfryer, notas_airfryer, enviar, fotos]
        default: estado
      cantidad:
        description: 'Cuántas recetas (solo para «enviar»)'
        required: false
        default: '200'

jobs:
  recetario:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
      URL: ${{ vars.SUPABASE_URL }}
    steps:
      - name: Lanzar la tarea
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ] || [ -z "$URL" ]; then echo "::warning title=Recetario::Faltan datos del servidor en GitHub."; exit 0; fi
          jq -n '{query: "select clave_tareas from public.ajustes_internos where id = 1", read_only: true}' > q.json
          CLAVE=$(curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @q.json | jq -r '.[0].clave_tareas // empty')
          if [ -z "$CLAVE" ]; then echo "::error title=Recetario::No se pudo leer la clave interna."; exit 1; fi
          echo "::add-mask::$CLAVE"
          ACCION="${{ inputs.accion || 'estado' }}"
          CANTIDAD="${{ inputs.cantidad || '200' }}"
          jq -n --arg a "$ACCION" --argjson c "$CANTIDAD" '{accion: $a, cantidad: $c}' > cuerpo.json
          CODIGO=$(curl -sS -o r.json -w '%{http_code}' -X POST "$URL/functions/v1/sembrar-recetas" \
            -H "x-tarea: $CLAVE" -H 'Content-Type: application/json' --data @cuerpo.json --max-time 400)
          RES=$(jq -c '{enviadas, aviso, cupo, errores, lotes: [.lotes[]? | {tipo, estado, cantidad, google, resultado}] | .[0:6]}' r.json 2>/dev/null || head -c 600 r.json)
          echo "$RES"
          if [ "$CODIGO" -ge 300 ]; then echo "::error title=Recetario ($ACCION)::HTTP $CODIGO $(head -c 400 r.json)"; exit 1; fi
          if [ "$ACCION" != "estado" ]; then echo "::notice title=Recetario ($ACCION)::$(echo "$RES" | head -c 1500)"; fi
