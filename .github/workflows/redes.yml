# Vídeos con IA para Instagram: lee un plan de redes/videos/*.json, pide cada clip a la función video-redes
# (Google Veo), espera a que esté y guarda los clips en redes/clips/ (se suben al repositorio). Se lanza a mano.
name: Vídeos para redes

on:
  workflow_dispatch:
    inputs:
      plan:
        description: 'Plan de vídeo (nombre del archivo en redes/videos, sin .json)'
        required: true

permissions:
  contents: write

jobs:
  videos:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
      URL: ${{ vars.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Hacer los clips
        run: |
          PLAN="redes/videos/${{ inputs.plan }}.json"
          [ -f "$PLAN" ] || { echo "::error title=Vídeos::No existe $PLAN"; exit 1; }
          jq -n '{query: "select clave_tareas from public.ajustes_internos where id = 1", read_only: true}' > q.json
          CLAVE=$(curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @q.json | jq -r '.[0].clave_tareas // empty')
          [ -n "$CLAVE" ] || { echo "::error title=Vídeos::No se pudo leer la clave interna."; exit 1; }
          echo "::add-mask::$CLAVE"
          mkdir -p redes/clips
          llamar() { curl -sS -X POST "$URL/functions/v1/video-redes" -H "x-tarea: $CLAVE" -H 'Content-Type: application/json' --data "$1" --max-time 300; }
          # Se piden todos a la vez y luego se recogen.
          : > ops.txt
          for i in $(seq 0 $(( $(jq '.clips | length' "$PLAN") - 1 ))); do
            NOMBRE=$(jq -r ".clips[$i].nombre" "$PLAN")
            if [ -f "redes/clips/$NOMBRE.mp4" ]; then echo "$NOMBRE ya existe"; continue; fi
            R=$(llamar "$(jq -c ".clips[$i] | {accion: \"crear\", prompt, nombre}" "$PLAN")")
            OP=$(echo "$R" | jq -r '.operacion // empty')
            [ -n "$OP" ] || { echo "::error title=Vídeo $NOMBRE::$(echo "$R" | head -c 500)"; continue; }
            echo "$NOMBRE $OP" >> ops.txt
            echo "$NOMBRE pedido con $(echo "$R" | jq -r .modelo)"
          done
          for vuelta in $(seq 1 40); do
            [ -s ops.txt ] || break
            sleep 20
            : > quedan.txt
            while read -r NOMBRE OP; do
              R=$(llamar "$(jq -nc --arg o "$OP" --arg n "$NOMBRE" '{accion: "recoger", operacion: $o, nombre: $n}')")
              if [ "$(echo "$R" | jq -r '.listo // empty')" = "true" ]; then
                curl -sS -o "redes/clips/$NOMBRE.mp4" "$(echo "$R" | jq -r .url)" && echo "$NOMBRE listo"
              elif [ "$(echo "$R" | jq -r '.ok // empty')" = "true" ]; then
                echo "$NOMBRE $OP" >> quedan.txt
              else
                echo "::error title=Vídeo $NOMBRE::$(echo "$R" | head -c 500)"
              fi
            done < ops.txt
            mv quedan.txt ops.txt
          done
          ls -la redes/clips
          echo "::notice title=Vídeos::$(ls redes/clips | tr '\n' ' ')"
      - name: Guardar los clips
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add redes/clips
          git diff --cached --quiet || { git commit -m "Clips de vídeo: ${{ inputs.plan }}"; git push; }
