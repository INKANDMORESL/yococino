# Publica la web pública (yococino.app) y el panel de gestión (admin.yococino.app) en IONOS.
# Usa DOS accesos distintos (cada uno limitado a su carpeta), para no tocar otros proyectos del alojamiento.
# En GitHub → Settings → Secrets and variables → Actions:
#   Secrets web:    IONOS_WEB_HOST, IONOS_WEB_USUARIO, IONOS_WEB_CONTRASENA
#   Secrets panel:  IONOS_PANEL_HOST, IONOS_PANEL_USUARIO, IONOS_PANEL_CONTRASENA
#   Variables (opcionales): IONOS_WEB_CARPETA e IONOS_PANEL_CARPETA (por defecto, la carpeta inicial del acceso).
# Nunca se borra nada en el servidor: solo se suben y reemplazan los archivos de Yococino.
# Si aún no están los datos, se deja un .zip con las dos webs para subirlas con FileZilla.
name: Web y panel

on:
  push:
    branches: [main]
    paths: ['web/**', 'panel/**', '.github/workflows/web.yml']
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar el panel con Supabase
        env:
          URL: ${{ vars.SUPABASE_URL }}
          CLAVE: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$CLAVE" ]; then echo "::error title=Panel::Faltan las variables SUPABASE_URL y SUPABASE_ANON_KEY"; exit 1; fi
          printf 'window.YOCOCINO = { url: %s, clave: %s };\n' "$(jq -Rn --arg v "$URL" '$v')" "$(jq -Rn --arg v "$CLAVE" '$v')" > panel/config.js

      - name: Guardar copias para FileZilla
        uses: actions/upload-artifact@v4
        with:
          name: webs-yococino
          path: |
            web
            panel

      - name: Subir a IONOS
        env:
          WEB_HOST: ${{ secrets.IONOS_WEB_HOST }}
          WEB_USUARIO: ${{ secrets.IONOS_WEB_USUARIO }}
          WEB_CONTRASENA: ${{ secrets.IONOS_WEB_CONTRASENA }}
          WEB_CARPETA: ${{ vars.IONOS_WEB_CARPETA }}
          PANEL_HOST: ${{ secrets.IONOS_PANEL_HOST }}
          PANEL_USUARIO: ${{ secrets.IONOS_PANEL_USUARIO }}
          PANEL_CONTRASENA: ${{ secrets.IONOS_PANEL_CONTRASENA }}
          PANEL_CARPETA: ${{ vars.IONOS_PANEL_CARPETA }}
        run: |
          sudo apt-get install -y lftp > /dev/null
          subir() { # origen host usuario contraseña carpeta nombre
            if [ -z "$2" ] || [ -z "$3" ] || [ -z "$4" ]; then
              echo "::warning title=IONOS $6::Faltan los datos de acceso en GitHub. Descarga 'webs-yococino' de esta ejecución y súbela con FileZilla."
              return 0
            fi
            # IONOS tiene el FTP desactivado: siempre por SFTP (los mismos usuarios sirven).
            local proto=sftp
            local ajustes="set net:max-retries 3; set net:timeout 30; set sftp:auto-confirm yes;"
            local host="${2#*://}"; host="${host%%/*}"; host="$(echo "$host" | tr -d '[:space:]')"
            # La contraseña va por variable de entorno (así no da problemas si lleva comas o símbolos).
            if LFTP_PASSWORD="$4" lftp --env-password -u "$(echo "$3" | tr -d '[:space:]')" "$proto://$host" \
                 -e "$ajustes mirror -R --verbose=1 $1 ${5:-.}; bye" > salida-$6.txt 2>&1; then
              echo "::notice title=IONOS $6::Publicada."
            else
              cat salida-$6.txt
              tail -n 6 salida-$6.txt | while IFS= read -r l; do echo "::error title=IONOS $6::$l"; done
              FALLO=1
            fi
          }
          FALLO=0
          subir web "$WEB_HOST" "$WEB_USUARIO" "$WEB_CONTRASENA" "$WEB_CARPETA" web
          subir panel "$PANEL_HOST" "$PANEL_USUARIO" "$PANEL_CONTRASENA" "$PANEL_CARPETA" panel
          exit $FALLO
