# Configuración para que GitHub aplique cambios en Supabase con la CLI.
project_id = "yococino"

[functions.preparar-menu]
# La plataforma comprueba que quien llama ha iniciado sesión; la función lo vuelve a comprobar.
verify_jwt = true

[functions.borrar-cuenta]
verify_jwt = true

[functions.cambiar-plato]
verify_jwt = true

[functions.cocinar-con]
verify_jwt = true

[functions.version-peques]
verify_jwt = true

[functions.cambiar-ingrediente]
verify_jwt = true

[functions.foto-receta]
verify_jwt = true

[functions.buscar-recetas]
verify_jwt = true

[functions.asignar-receta]
verify_jwt = true

[functions.sembrar-recetas]
# La función comprueba ella misma: administrador con sesión o clave interna de tareas (GitHub).
verify_jwt = false

[functions.admin]
verify_jwt = true

[functions.web-recetas]
verify_jwt = true

[functions.aligerar-fotos]
# La llama el propio servidor con una clave interna (la función lo comprueba); también un administrador.
verify_jwt = false

[functions.importar-receta]
verify_jwt = true

[functions.video-redes]
# Solo el equipo: la función comprueba administrador con sesión o clave interna de tareas (GitHub).
verify_jwt = false

[functions.preferencias]
verify_jwt = true

[functions.especiales]
verify_jwt = true
